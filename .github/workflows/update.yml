name: Update NEEDLES Tracker

on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다 (UTC). KST 기준 09/15/21/03시
  workflow_dispatch: {}       # 수동 실행 버튼
  push:
    branches: [ main ]
    paths:
      - "scrape.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write   # index.html, seen.json 커밋
  pages: write
  id-token: write

concurrency:
  group: needles-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install beautifulsoup4 lxml

      - name: Run scraper
        run: python scrape.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html seen.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "auto: update tracker $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 다른 실행이 먼저 push 했을 수 있으니 원격을 당겨와 충돌 방지
            for i in 1 2 3; do
              git pull --rebase --autostash origin main || true
              if git push origin main; then
                echo "pushed"; break
              fi
              echo "push retry $i"; sleep 3
            done
          fi
